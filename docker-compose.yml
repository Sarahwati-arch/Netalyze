services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    depends_on:
      - worker

  worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    env_file:
      - ./python-worker/.env
    volumes:
      - ig_session:/app/data
    restart: unless-stopped

volumes:
  ig_session:
